<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/logo-videoshorts.png" />
  <link rel="alternate icon" href="/favicon.ico" />
  <!-- viewport-fit=cover so the bottom tab bar can pad itself past the iOS home
       indicator with env(safe-area-inset-bottom); without it that inset reads 0. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="color-scheme" content="dark" />

  <!-- Fonts: Lumen system (Instrument Serif display · Geist body · JetBrains Mono labels).
       Served from this origin, not fonts.googleapis.com: a Google-hosted
       stylesheet sends every visitor's IP address to a US processor before the
       page has rendered and before anyone consented to anything. See
       public/fonts.css for how the subsets were generated. -->
  <link rel="stylesheet" href="/fonts.css" />

  <!-- Primary SEO Meta Tags -->
  <!-- Title and description are kept under 60 and 160 characters (measured, not
       eyeballed): Google truncates past roughly that width, and a truncated
       description is a worse answer than a shorter deliberate one. -->
  <title>VideoShorts — Free AI Video Studio</title>
  <meta name="description" content="Convert long podcasts, streams, and interviews into viral 9:16 vertical shorts with face tracking and animated karaoke subtitles. 100% free and open source." />
  <meta name="author" content="VideoShorts" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <!-- Canonical must match the host actually served. The apex redirects to www,
       so pointing this at the apex named a URL that only ever redirects. -->
  <link rel="canonical" href="https://www.videoshorts.app/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.videoshorts.app/" />
  <meta property="og:title"
    content="VideoShorts — Free AI Video Studio" />
  <meta property="og:description"
    content="Convert long podcasts, streams, and interviews into viral 9:16 vertical shorts with face tracking and animated karaoke subtitles. 100% free and open source." />
  <meta property="og:image" content="https://www.videoshorts.app/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="VideoShorts" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://www.videoshorts.app/" />
  <meta name="twitter:title"
    content="VideoShorts — Free AI Video Studio" />
  <meta name="twitter:description"
    content="Convert long podcasts, streams, and interviews into viral 9:16 vertical shorts with face tracking and animated karaoke subtitles. 100% free and open source." />
  <meta name="twitter:image" content="https://www.videoshorts.app/og-image.png" />

  <!-- JSON-LD Structured Data
       Two products, described separately and on purpose. The previous graph
       declared a single SoftwareApplication priced at 0, which is true of the
       self-hosted edition and false of the hosted one, so engines summarised the
       whole product as free. SoftwareApplication below is the MIT project;
       Service is VideoShorts Cloud, with the real price range on it. -->
  

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
