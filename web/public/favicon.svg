<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Obsidian Dark Backdrop with subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8"/>
  <rect x="24" y="24" width="464" height="464" rx="102" stroke="#334155" stroke-width="2" opacity="0.6"/>

  <!-- 9:16 Vertical Crop Guide Frame -->
  <rect x="160" y="90" width="192" height="332" rx="28" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="16 8"/>

  <!-- Bold Brand Geometric 'V' -->
  <path d="M150 145 L204 145 L256 288 L308 145 L362 145 L282 365 C276 380 258 390 242 384 C236 381 230 375 226 368 Z" 
        fill="url(#brandGrad)" 
        filter="url(#neonGlow)"/>

  <!-- Solid White Play Triangle -->
  <path d="M236 195 L300 240 L236 285 Z" fill="#ffffff"/>
  
  <!-- Vertical Frame Accent Caps -->
  <rect x="220" y="90" width="72" height="5" rx="2.5" fill="#06b6d4"/>
  <rect x="220" y="417" width="72" height="5" rx="2.5" fill="#8b5cf6"/>
</svg>
